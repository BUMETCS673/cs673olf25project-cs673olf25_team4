name: Deploy to EC2 - TEST

on:
  push:
    branches:
      - test   # Only trigger on pushes to test

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JAMBASE_API_KEY: ${{ secrets.JAMBASE_API_KEY }}
      TM_API_SECRET: ${{ secrets.TM_API_SECRET }}
      TM_API_KEY: ${{ secrets.TM_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: test   # Always checkout test

      - name: Deploy via SSH using deploy key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ec2-user
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            export JAMBASE_API_KEY=${{ secrets.JAMBASE_API_KEY }}
            export TM_API_SECRET=${{ secrets.TM_API_SECRET }}
            export TM_API_KEY=${{ secrets.TM_API_KEY }}
            echo "Deploying test branch"

            # Ensure Git is installed
            if ! command -v git &> /dev/null
            then
              sudo yum update -y
              sudo yum install -y git
            fi

            # Go to EC2 home directory
            cd /home/ec2-user

            echo "Cleaning up Docker environment..."

            # Stop and remove all containers
            if [ "$(docker ps -aq)" ]; then
              echo "Removing all containers..."
              sudo docker stop $(docker ps -aq) || true
              sudo docker rm -f $(docker ps -aq) || true
            fi

            # Remove all images
            if [ "$(docker images -q)" ]; then
              echo "Removing all images..."
              sudo docker rmi -f $(docker images -q) || true
            fi

            # Optionally prune everything (dangling volumes/networks)
            sudo docker system prune -a -f --volumes || true

            # Remove old repo if it exists
            if [ -d "cs673olf25project-cs673olf25_team4" ]; then
              echo "Removing old repository..."
              rm -rf cs673olf25project-cs673olf25_team4
            fi

            # Clone fresh repo from test branch
            git clone --branch test git@github.com:BUMETCS673/cs673olf25project-cs673olf25_team4.git

            # Rebuild and start containers
            cd cs673olf25project-cs673olf25_team4/src || exit 1
            sudo -E docker-compose build --no-cache
            sudo -E docker-compose up -d
