name: Deploy to EC2 - TEST

on:
  push:
    branches:
      - test   # Only trigger on pushes to test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: test   # Always checkout test

      - name: Deploy via SSH using deploy key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ec2-user
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            echo "Deploying test branch"

            # Ensure Git is installed
            if ! command -v git &> /dev/null
            then
              sudo yum update -y
              sudo yum install -y git
            fi

            # Go to EC2 home directory
            cd /home/ec2-user

            # Remove existing containers if they are running
            if [ "$(docker ps -q)" ]; then
              echo "Stopping existing containers..."
              sudo docker-compose -f cs673olf25project-cs673olf25_team4/code/docker-compose.yml down
            fi

            # Clone or update repo from test
            if [ ! -d "cs673olf25project-cs673olf25_team4" ]; then
              git clone --branch test git@github.com:BUMETCS673/cs673olf25project-cs673olf25_team4.git
            else
              cd cs673olf25project-cs673olf25_team4
              git fetch origin test:test
              git checkout test
              git pull origin test
              cd ..
            fi

            # Go into repo and redeploy containers
            cd cs673olf25project-cs673olf25_team4/code || exit 1
            sudo docker-compose down
            sudo docker-compose up -d
