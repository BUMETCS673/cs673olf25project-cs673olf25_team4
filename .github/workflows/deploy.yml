name: Deploy to EC2

on:
  push:
  pull_request:
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags
          ref: ${{ github.ref_name || github.head_ref || 'main' }}  # Checkout the branch that triggered the workflow

      - name: Deploy via SSH using deploy key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            # Ensure Git is installed
            if ! command -v git &> /dev/null
            then
              sudo yum update -y
              sudo yum install -y git
            fi

            # Go to EC2 home directory
            cd /home/ec2-user

            # Remove existing containers if they are running
            if [ "$(docker ps -q)" ]; then
              echo "Stopping existing containers..."
              sudo docker-compose -f cs673olf25project-cs673olf25_team4/code/docker-compose.yml down
            fi

            # Determine branch
            BRANCH=${GITHUB_REF_NAME}
            if [ -z "$BRANCH" ]; then
              BRANCH=$GITHUB_HEAD_REF
            fi
            BRANCH=${BRANCH:-main}
            echo "Deploying branch: $BRANCH"

            echo "The branch is: $BRANCH"

            if [ ! -d "cs673olf25project-cs673olf25_team4" ]; then
              git clone --branch "$BRANCH" git@github.com:BUMETCS673/cs673olf25project-cs673olf25_team4.git
            else
              cd cs673olf25project-cs673olf25_team4
              git fetch origin
              git checkout "$BRANCH"
              git pull origin "$BRANCH"
              cd ..
            fi


            # Go into repo and redeploy containers
            cd cs673olf25project-cs673olf25_team4/code || exit 1
            sudo docker-compose down
            sudo docker-compose up -d
