name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Cloud Build for Backend
        run: |
          gcloud builds submit \
            --config=cloudbuild-backend.yaml \
            --substitutions=_REGION=${{ secrets.BACKEND_REGION }},_SERVICE=${{ secrets.BACKEND_SERVICE }},_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
