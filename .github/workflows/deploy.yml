name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  deploy:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: main   # Always checkout main

      - name: Deploy via SSH using deploy key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            echo "Starting deployment of main branch..."

            echo "Checking if Git is installed..."
            if ! command -v git &> /dev/null
            then
              echo "Git not found. Installing Git..."
              sudo yum update -y
              sudo yum install -y git
            else
              echo "Git already installed."
            fi

            echo "Changing to home directory..."
            cd /home/ec2-user

            echo "Checking for running containers..."
            if [ "$(docker ps -q)" ]; then
              echo "Stopping existing containers..."
              sudo docker-compose -f cs673olf25project-cs673olf25_team4/code/docker-compose.yml down
              echo "Containers stopped."
            else
              echo "No running containers found."
            fi

            echo "Checking for old repository..."
            if [ -d "cs673olf25project-cs673olf25_team4" ]; then
              echo "Removing old repository..."
              rm -rf cs673olf25project-cs673olf25_team4
              echo "Old repository removed."
            else
              echo "No old repository found."
            fi

            echo "Wait..."
            sleep 3
            echo "Cloning fresh copy of repository (branch: main)..."
            git clone --branch main git@github.com:BUMETCS673/cs673olf25project-cs673olf25_team4.git
            echo "Repository cloned."

            echo "Moving into project code directory..."
            cd cs673olf25project-cs673olf25_team4/code || exit 1

            echo "Rebuilding Docker containers from scratch..."
            sudo docker-compose build --no-cache
            echo "Docker images built."

            echo "Starting Docker containers..."
            sudo docker-compose up -d
            echo "Deployment complete."
