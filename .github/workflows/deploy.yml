name: Deploy to EC2

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH using deploy key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            # Ensure Git is installed
            if ! command -v git &> /dev/null
            then
              sudo yum update -y
              sudo yum install -y git
            fi

            # Go to EC2 home directory
            cd /home/ec2-user

            # Clone repo if it doesn't exist, otherwise pull latest changes
            if [ ! -d "cs673olf25project-cs673olf25_team4" ]; then
              git clone git@github.com:BUMETCS673/cs673olf25project-cs673olf25_team4.git
            else
              cd cs673olf25project-cs673olf25_team4
              git pull origin main
              cd ..
            fi

            # Go into repo and redeploy containers
            cd cs673olf25project-cs673olf25_team4/code || exit 1
            docker-compose down
            docker-compose up -d
