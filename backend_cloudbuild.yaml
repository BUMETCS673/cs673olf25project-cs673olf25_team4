substitutions:
  _REGION: '${_REGION}'
  _SERVICE: '${_SERVICE}'
  _PROJECT_ID: '${_PROJECT_ID}'

steps:
  # Build image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/beatmap-backend/${_SERVICE}:latest',
        './code/backend',
      ]

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/beatmap-backend/${_SERVICE}:latest',
      ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', '${_SERVICE}',
        '--image', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/beatmap-backend/${_SERVICE}:latest',
        '--region', '${_REGION}',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '8000',
      ]

options:
  logging: CLOUD_LOGGING_ONLY
