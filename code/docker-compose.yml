services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concert_backend
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - ticketmaster_provider
      - jambase_provider
    environment:
      # Backend should call providers by service name + container port (both = 8000)
      TM_PROVIDER_URL: http://ticketmaster_provider:8000
      TICKETMASTER_API_URL: http://ticketmaster_provider:8000   # fallback for older code
      JAMBASE_API_URL: http://jambase_provider:8000

  ticketmaster_provider:
    build:
      context: ./providers/ticketmaster
      dockerfile: Dockerfile
    container_name: ticketmaster_provider
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"   # host:container
    environment:
      TM_API_KEY: ${TM_API_KEY}
      TM_BASE_URL: ${TM_BASE_URL}
      
  jambase_provider:
    build:
      context: ./providers/jambase
      dockerfile: Dockerfile
    container_name: jambase_provider
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"   # host:container


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beatmap_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
