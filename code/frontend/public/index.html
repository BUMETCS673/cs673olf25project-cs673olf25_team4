<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>beatmap</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa6b2;
      --accent:#ec4899; /* pink */
      --glass: rgba(255,255,255,0.04);
      --radius:14px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;}
    body {
      margin:0;
      background: linear-gradient(180deg,#071021 0%, #0a1724 60%);
      color:#e6eef6;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .container {
      width:100%;
      max-width:980px;
      border-radius:20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 8px 30px rgba(2,6,23,0.7);
      padding:28px;
      backdrop-filter: blur(6px);
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:20px;
    }
    .panel {
      background: linear-gradient(180deg,var(--glass), rgba(255,255,255,0.02));
      padding:22px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.03);
    }
    .brand {
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:18px;
    }
    .logo {
      width:52px;
      height:52px;
      border-radius:12px;
      background: linear-gradient(135deg,#ec4899,#06b6d4);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:white;
      box-shadow: 0 6px 18px rgba(236,72,153,0.18);
    }
    h1{margin:0;font-size:20px;letter-spacing:-0.2px;}
    p.lead{margin-top:8px;color:var(--muted);font-size:13px;}

    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
    input, select, textarea {
      width:100%;
      padding:10px 12px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      border-radius:10px;
      color:inherit;
      outline:none;
      font-size:14px;
    }
    textarea {resize: vertical; min-height:70px;}

    .form-row{display:flex;gap:10px;margin-top:12px;}
    .btn {
      display:inline-flex;
      align-items:center;
      background: linear-gradient(90deg,var(--accent), #06b6d4);
      padding:10px 14px;
      border-radius:12px;
      border:none;
      color:white;
      font-weight:600;
      cursor:pointer;
      margin-top:14px;
    }
    .btn:disabled{opacity:0.6;cursor:not-allowed;}

    .results {
      padding:18px;
      border-radius:var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      border: 1px solid rgba(255,255,255,0.02);
      min-height:320px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .status{color:var(--muted);font-size:13px;}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px;}
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.02);
    }
    .card h3{margin:0 0 8px 0;font-size:15px;}
    .card p{margin:0;font-size:13px;color:var(--muted);}
    .empty{margin-top:24px;color:var(--muted);font-size:14px;text-align:center;}
    @media (max-width:880px){.container{grid-template-columns:1fr; padding:18px;}}
  </style>
</head>
<body>
  <main class="container">
    <!-- Left: search -->
    <section class="panel">
      <div class="brand">
        <div class="logo">BM</div>
        <div>
          <h1>beatmap</h1>
          <p class="lead">Find concerts with structured search or natural language.</p>
        </div>
      </div>

      <!-- Structured form -->
      <form id="search-form">
        <div class="form-row" style="flex-direction:column;">
          <label for="q">Keyword (artist, venue — optional)</label>
          <input id="q" name="q" type="text" placeholder="e.g. Radiohead" />
        </div>

        <div class="form-row">
          <div style="flex:1">
            <label for="city">City</label>
            <input id="city" name="city" type="text" placeholder="Boston" />
          </div>
          <div style="width:140px">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" />
          </div>
        </div>

        <div class="form-row">
          <div style="flex:1">
            <label for="radius">Radius (km)</label>
            <select id="radius" name="radius">
              <option value="10">10 km</option>
              <option value="25">25 km</option>
              <option value="50" selected>50 km</option>
              <option value="100">100 km</option>
            </select>
          </div>
          <div style="width:140px">
            <label for="vendor">Vendor</label>
            <select id="vendor" name="vendor">
              <option value="auto" selected>Auto</option>
              <option value="ticketmaster">Ticketmaster</option>
              <option value="songkick">Songkick</option>
            </select>
          </div>
        </div>
        <button class="btn" type="submit">Search concerts</button>
      </form>

      <hr style="margin:20px 0;border:0;border-top:1px solid rgba(255,255,255,0.06)">

      <!-- Natural language -->
      <form id="nl-form">
        <label for="nlq">Natural language query</label>
        <textarea id="nlq" name="nlq" placeholder="e.g. Show me jazz concerts in NYC this weekend"></textarea>
        <button class="btn" type="submit">Ask AI Agent</button>
      </form>
    </section>

    <!-- Right: results -->
    <section class="results">
      <strong>Results</strong>
      <div class="status" id="results-status">No search yet</div>
      <div id="results-container" class="cards"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const nlForm = document.getElementById('nl-form');
    const resultsContainer = document.getElementById('results-container');
    const statusEl = document.getElementById('results-status');
    const nlqInput = document.getElementById('nlq');

    function renderEmpty(msg){resultsContainer.innerHTML=`<div class="empty">${msg}</div>`;}

    function renderResults(items){
      resultsContainer.innerHTML='';
      if(!items||!items.length){renderEmpty("No results.");return;}
      items.forEach(it=>{
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`<h3>${it.title||'Untitled'}</h3>
          <p>${it.date||''} ${it.venue?`• ${it.venue}`:''} ${it.city?`— ${it.city}`:''}</p>`;
        resultsContainer.appendChild(card);
      });
    }

    async function doSearch(params, endpoint="/concerts"){
      const url=new URL(endpoint, window.location.origin);
      Object.entries(params).forEach(([k,v])=>{if(v)url.searchParams.set(k,v);});
      try{
        statusEl.textContent="Searching...";
        const res=await fetch(url);
        const data=await res.json();
        renderResults(Array.isArray(data)?data:data.results||[]);
        statusEl.textContent=`Found ${Array.isArray(data)?data.length:data.results?.length||0} concerts`;
      }catch(e){
        renderEmpty("Error reaching backend.");
        statusEl.textContent="Error";
      }
    }

    form.addEventListener('submit',e=>{
      e.preventDefault();
      if(nlqInput.value.trim()){statusEl.textContent="Disable natural language to use the form.";return;}
      const fd=new FormData(form);
      const params=Object.fromEntries(fd.entries());
      doSearch(params);
    });

    nlForm.addEventListener('submit',e=>{
      e.preventDefault();
      if([...form.elements].some(el=>el.value && el.type!=="submit")) {
        statusEl.textContent="Disable form inputs to use natural language.";return;
      }
      const nlq=nlqInput.value.trim();
      if(!nlq){statusEl.textContent="Enter a query.";return;}
      doSearch({q:nlq}, "/nl-concerts"); // separate endpoint for AI agent
    });

    renderEmpty("Use the form or natural language to search.");
  </script>
</body>
</html>
