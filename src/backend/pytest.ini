[tool:pytest]
# Pytest configuration for BeatMap SSL/HTTPS Testing

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# Markers for test categorization
markers =
    ssl: SSL/HTTPS configuration tests
    middleware: Security middleware tests
    configuration: Configuration and settings tests
    security-headers: Security headers tests
    https-redirection: HTTPS redirection tests
    cors: CORS configuration tests
    rate-limiting: Rate limiting tests
    validation: Input validation tests
    integration: Integration tests
    unit: Unit tests
    bdd: BDD/Gherkin feature tests
    tdd: TDD unit tests
    slow: Marks tests as slow (deselect with '-m "not slow"')
    smoke: Smoke tests for basic functionality

# Test environment setup
env =
    ENVIRONMENT = test
    SSL_ENABLED = false
    FORCE_HTTPS = false
    HSTS_ENABLED = false
    CSP_ENABLED = true
    CORS_ORIGINS = https://localhost:3000,http://localhost:3000

# Async test configuration
asyncio_mode = auto

# Logging during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov