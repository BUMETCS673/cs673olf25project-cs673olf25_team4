version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concert_backend
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - ticketmaster_provider
      - jambase_provider
      - groq_provider
    environment:
      JAMBASE_API_URL: http://jambase_provider:8002
      JAMBASE_API_KEY: ${JAMBASE_API_KEY}
      TM_API_SECRET: ${TM_API_SECRET}
      TM_API_KEY: ${TM_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TM_BASE_URL: https://app.ticketmaster.com/discovery/v2
      TM_PROVIDER_URL: http://ticketmaster_provider:8000
      TICKETMASTER_API_URL: http://ticketmaster_provider:8000
      GROQ_PROVIDER_URL: http://groq_provider:8000

  ticketmaster_provider:
    build:
      context: .
      dockerfile: providers/ticketmaster/Dockerfile
    container_name: ticketmaster_provider
    command: >
      uvicorn ticketmaster_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      TM_API_KEY: ${TM_API_KEY}
      TM_API_SECRET: ${TM_API_SECRET}
      TM_BASE_URL: https://app.ticketmaster.com/discovery/v2

  jambase_provider:
    build:
      context: .
      dockerfile: providers/jambase/Dockerfile
    container_name: jambase_provider
    command: >
      uvicorn jambase_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    environment:
      JAMBASE_API_KEY: ${JAMBASE_API_KEY}

  groq_provider:
    build:
      context: .
      dockerfile: providers/groq/Dockerfile
    container_name: groq_provider
    command: >
      uvicorn groq_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beatmap_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # auto reload nginx config if changed
    restart: always

  backend-test:
    build:
      context: ./backend
      dockerfile: dockerfile.test
    command: pytest -q --disable-warnings
