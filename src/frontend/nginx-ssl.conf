# NGINX SSL Configuration for BeatMap Frontend
# Supports HTTP/HTTPS with automatic redirection and security headers

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost testbeatmap.com beatmap.live;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - Main Application
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost testbeatmap.com beatmap.live;

    root /usr/share/nginx/html;
    index index.html;

    # ==================== SSL Configuration ====================

    # SSL Certificates (paths will vary by environment)
    # Development
    ssl_certificate /etc/nginx/ssl/dev/server.crt;
    ssl_certificate_key /etc/nginx/ssl/dev/server.key;

    # Production (uncomment and update paths when deploying)
    # ssl_certificate /etc/letsencrypt/live/beatmap.live/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/beatmap.live/privkey.pem;

    # Test Server (uncomment and update paths when deploying)
    # ssl_certificate /etc/letsencrypt/live/testbeatmap.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/testbeatmap.com/privkey.pem;

    # SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Diffie-Hellman parameters for DHE ciphersuites
    # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/dev/server.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==================== Security Headers ====================

    # HTTP Strict Transport Security (HSTS)
    # Tells browsers to always use HTTPS for this domain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (CSP)
    # Prevents XSS and other code injection attacks
    # IMPORTANT: connect-src must include your own backend domain
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://beatmap.live https://testbeatmap.com https://api.jambase.com https://app.ticketmaster.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # X-Frame-Options
    # Prevents clickjacking attacks
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options
    # Prevents MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection
    # Enables browser XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy
    # Controls how much referrer information is sent
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy
    # Controls which browser features can be used
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Cross-Origin Policies
    # Relaxed for production compatibility
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Additional Security Headers
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;

    # Remove server version information
    server_tokens off;
    # more_clear_headers Server;  # Requires nginx-module-headers-more (not available in alpine)

    # ==================== Application Routes ====================

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==================== Backend API Proxy ====================

    # Proxy API calls to backend service (HTTPS)
    location /api/ {
        # Use HTTPS for backend communication in production
        proxy_pass https://concert_backend_prod:8443/api/;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSL proxy settings
        proxy_ssl_verify off;  # Set to 'on' in production with proper certs
        proxy_ssl_session_reuse on;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (allow HTTP for load balancers)
    location /health {
        proxy_pass http://concert_backend_prod:8000/health;
        access_log off;
    }

    # Specific concert endpoints
    location /concerts {
        proxy_pass https://concert_backend_prod:8443/concerts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSL proxy settings
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /nl-concerts {
        proxy_pass https://concert_backend_prod:8443/nl-concerts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSL proxy settings
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==================== Error Pages ====================

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ==================== Logging ====================

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}