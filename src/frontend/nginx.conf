# ===============================
# BeatMap Frontend - HTTPS config
# ===============================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name beatmap.live www.beatmap.live;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name beatmap.live www.beatmap.live;

    # SSL certificates (Let's Encrypt mounted from host)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver (so "backend" resolves to container IP)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream https://backend:8443;

    # Serve the SPA (React / Vite)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of HTML files
        location ~* \.(html)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache static assets (JS, CSS, images, fonts)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Explicitly prevent caching of index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy API calls (optional prefix /api)
    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Prevent caching of API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # === Specific endpoints ===
    # Match both /concerts and /concerts/; preserve query string explicitly
    location ~ ^/concerts(/|$) {
        proxy_pass $backend_upstream$request_uri;   # ✅ THIS is the key line
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        
        # Prevent caching of concert data
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }


    location ~ ^/nl-concerts(/|$) {
        proxy_pass $backend_upstream/nl-concerts/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        
        # Prevent caching of concert data
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Log requests for debugging (optional but useful)
    access_log /var/log/nginx/access.log combined;

    # Handle error fallback for SPA
    error_page 497 500 502 503 504 /index.html;
}
