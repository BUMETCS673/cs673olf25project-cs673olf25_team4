server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend service
    location /api/ {
        proxy_pass http://concert_backend_prod:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: proxy specific endpoints used by the frontend
    location /concerts {
        proxy_pass http://concert_backend_prod:8000/concerts;
    }
    location /nl-concerts {
        proxy_pass http://concert_backend_prod:8000/nl-concerts;
    }
}
