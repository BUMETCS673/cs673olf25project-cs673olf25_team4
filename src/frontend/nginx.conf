server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver for runtime resolution
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:8443;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend service
    # Using variable forces runtime DNS resolution instead of startup resolution
    location /api/ {
        proxy_pass http://$backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: proxy specific endpoints used by the frontend
    location /concerts {
        proxy_pass http://$backend_upstream/concerts;
    }
    location /nl-concerts {
        proxy_pass http://$backend_upstream/nl-concerts;
    }
}
